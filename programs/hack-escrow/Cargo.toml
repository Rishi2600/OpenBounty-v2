[package]
name = "hack-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
cpi = ["no-entrypoint"]
serde = ["serde", "dep:serde"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
spl-token = { version = "3.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.8"

[dev-dependencies]
anchor-lang = { version = "0.30.1", features = ["no-entrypoint"] }
solana-program-test = "2.0.0"
solana-sdk = "2.0.0"

[profile.release]
overflow-checks = true
lto = false
codegen-units = 1
panic = "abort"

[toolchain]
anchor = "0.30.1"
rust = "1.77.0"

[features]
default = []
cpi = ["no-entrypoint"]
serde = ["serde", "dep:serde"]

[programs.localnet]
hack_escrow = "HackEscrow1111111111111111111111111111111"

[programs.devnet]
hack_escrow = "HackEscrow1111111111111111111111111111111"

[programs.mainnet-beta]
hack_escrow = "HackEscrow1111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run mocha -t 10000 tests/"
build = "cargo build-so --manifest-path=./programs/hack-escrow/Cargo.toml"
